# Infraestrutura local de desenvolvimento. Não use estas configurações fora da sua máquina.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: careflow
      POSTGRES_DB: careflow_scheduling
      # Sem senha apenas porque a porta fica presa ao loopback; nunca reutilize em outro ambiente.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - careflow-postgres:/var/lib/postgresql/data
      # Cria os bancos de cada serviço e os logins das APIs e despachantes (sem superusuário, sujeitos ao RLS).
      - ./deploy/postgres/init-dev.sql:/docker-entrypoint-initdb.d/init-dev.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow -d careflow_scheduling"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      # Credenciais só de desenvolvimento; a porta fica presa ao loopback.
      RABBITMQ_DEFAULT_USER: careflow
      RABBITMQ_DEFAULT_PASS: careflow-dev
    ports:
      - "127.0.0.1:5672:5672"
      # Painel de administração em http://localhost:15672
      - "127.0.0.1:15672:15672"
    volumes:
      - careflow-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  careflow-postgres:
  careflow-rabbitmq:
