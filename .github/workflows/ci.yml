name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build, formatação e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (lock file obrigatório)
        run: dotnet restore --locked-mode

      - name: Verificar formatação
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Testes com cobertura (mínimo 80% de linhas)
        env:
          # O teste de gravação do Painel escreve aqui os cenários (ADR-0010).
          CAREFLOW_PANEL_RECORDING: ${{ github.workspace }}/panel-recording/panel.json
          # A avaliação da triagem reproduz as respostas gravadas e publica as métricas aqui (ADR-0011).
          CAREFLOW_TRIAGE_EVALUATION: ${{ github.workspace }}/triage-evaluation/triage-evaluation.json
        run: >
          dotnet test -c Release --no-build
          --coverlet --coverlet-output-format cobertura
          --coverlet-threshold 80
          --results-directory ./TestResults

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publicar avaliação da triagem
        uses: actions/upload-artifact@v7
        with:
          name: triage-evaluation
          path: triage-evaluation/triage-evaluation.json
          retention-days: 30
          if-no-files-found: error

      - name: Publicar gravação do Painel
        uses: actions/upload-artifact@v7
        with:
          name: panel-recording
          path: panel-recording/panel.json
          retention-days: 30
          if-no-files-found: error

  dependency-review:
    name: Revisão de dependências
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
